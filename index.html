<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhro Healthcare Indonesia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- header section -->
    <header class="header">
      <img src="assets/bhro-blue.webp" alt="Bhro Logo" class="logo" />
    </header>
    <!-- Hero Section -->
    <section class="hero">
      <img src="assets/homepage-hero.jpg" alt="Hero" class="hero-image" />
      <div class="hero-overlay">
        <h1>Abangmu untuk<br>kesehatan cowok</h1>
        <p>Aman, terpercaya,<br>dan tanpa stigma</p>
      </div>
    </section>

    <!-- Info Icons -->
    <div class="info-icons">
      <div>🩺 dokter berlisensi</div>
      <div>💊 obat resmi</div>
      <div>📦 kirim seluruh Indonesia</div>
      <div>🎁 paket dirahasiakan</div>
      <div>💵 bisa COD</div>
    </div>

    <!-- Kategori -->
    <section class="categories">
      <div class="card blue">
        <h2>Kualitas seks</h2>
        <img src="assets/pill.png" alt="Kualitas seks">
      </div>
      <div class="card yellow">
        <h2>Kesuburan pria</h2>
        <img src="assets/stethoscope-1.png" alt="Kesuburan pria">
      </div>
      <div class="card darkblue">
        <h2>Keamanan seks</h2>
        <img src="assets/condom.png" alt="Keamanan seks">
      </div>
    </section>

  </div>
</body>
</html>

</body>
</html>
